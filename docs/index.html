<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little by Little｜英文筆記</title><link rel="stylesheet" href="style.css"><body><aside><a class="brand" href="#">little<br>by little<span>MY ENGLISH JOURNAL</span></a><nav><button data-page="home">◌ 今日一點點<span class="button-en" lang="en">Today</span></button><button data-page="words">Aa 我的單字<span class="button-en" lang="en">My Words</span></button><button data-page="phrases">↗ 我的會話<span class="button-en" lang="en">My Phrases</span></button><button data-page="review">↻ 找回記憶<span class="button-en" lang="en">Review</span></button><button data-page="grammar">▦ 英文地圖<span class="button-en" lang="en">English Map</span></button></nav><p class="aside-note">不用一次學很多。<br>從生活裡，慢慢累積。</p><label class="import">匯入備份<span class="button-en" lang="en">Import Backup</span><input id="import" type="file" accept="application/json"></label></aside><main><header><span>MY EVERYDAY ENGLISH</span><span id="date"></span></header><div id="view"></div><footer><div class="footer-tools"><button id="export">匯出學習筆記 ↓<span class="button-en" lang="en">Export Notes</span></button></div>記錄保存在此瀏覽器，請定期匯出備份。不同裝置與聊天不會自動同步。<span id="storage"></span></footer></main><dialog id="add"><form id="entry"><h2>收進我的筆記</h2><label>類型<select name="type"><option value="word">單字</option><option value="phrase">會話／片語</option></select></label><label>英文<input name="en" required maxlength="300"></label><label>中文意思<input name="zh" required maxlength="300"></label><label>生活主題<select name="topic"><option>日常</option><option>工作</option><option>自由潛水</option><option>滑雪</option><option>旅遊</option></select></label><label>例句／自己的筆記<textarea name="note" maxlength="1000"></textarea></label><div class="actions"><button type="button" id="cancel">取消<span class="button-en" lang="en">Cancel</span></button><button class="primary">收進筆記<span class="button-en" lang="en">Save Note</span></button></div></form></dialog><script sr
